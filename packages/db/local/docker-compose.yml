# Local Supabase for Speedy SaaS, built from Docker Hub images (the Supabase CLI's own images
# live on an ECR CDN that some networks block). Same roles, JWT secret and demo keys as
# `supabase start`, so apps and tests use the same env values either way.
#
#   pnpm --filter @speedy/db db:local:up      # start, wait for health, apply migrations
#   pnpm --filter @speedy/db db:local:down    # stop and delete data
#
# Gateway: http://127.0.0.1:54321  (auth/v1, rest/v1, storage/v1)   Postgres: 127.0.0.1:54322
name: speedy-supabase

x-jwt-secret: &jwt_secret super-secret-jwt-token-with-at-least-32-characters-long
x-anon-key: &anon_key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
x-service-key: &service_key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

services:
  db:
    image: postgres:17-alpine
    ports:
      - '54322:5432'
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  auth:
    image: supabase/gotrue:v2.180.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3001
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:*/**,http://localhost:*/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: ''
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '1000'
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 3s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v13.0.4
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,job_photos,missed_call,rain_day
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: *jwt_secret
      PGRST_APP_SETTINGS_JWT_EXP: '3600'
      PGRST_DB_MAX_ROWS: '1000'

  storage:
    image: supabase/storage-api:v1.28.0
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      SERVER_PORT: '5000'
      ANON_KEY: *anon_key
      SERVICE_KEY: *service_key
      AUTH_JWT_SECRET: *jwt_secret
      PGRST_JWT_SECRET: *jwt_secret
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      DB_INSTALL_ROLES: 'false'
      FILE_SIZE_LIMIT: '52428800'
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5000/status || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - '54321:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  storage-data:
